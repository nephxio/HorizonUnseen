name: CI

# Tier 1: prove the project builds from a bare clone.
#
# This is deliberately not a release workflow. Its job is to catch the failure
# nobody would otherwise notice -- that the documented from-scratch build path
# is broken -- and to do it where a red run costs nothing.
#
# The runner has no GPU and no display, so the game cannot be launched here.
# It can, however, be compiled and its logic exercised: the Catch2 suite in
# tests/ checks individual rules, and the headless simulation library in
# src/Sim lets whole episodes be played through without a window.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the workflow be run by hand from the Actions tab while it is being
  # debugged, without needing to push a commit each time.
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows / MSVC / ${{ matrix.build_type }}
    runs-on: windows-latest

    env:
      # Single source of truth: both the cache key and the installer read this,
      # so bumping the SDK invalidates the cache automatically.
      VULKAN_SDK_VERSION: 1.3.296.0

    strategy:
      fail-fast: false
      matrix:
        # Debug catches assertions and Release catches the optimiser-only
        # problems; both are cheap enough to run every time.
        #
        # The runtime library is spelled out per configuration rather than
        # derived with a CMake generator expression: those contain '>' and the
        # Windows runners default to PowerShell, which would read it as output
        # redirection.
        include:
          - build_type: Debug
            msvc_runtime: MultiThreadedDebug
          - build_type: Release
            msvc_runtime: MultiThreaded

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # glfw and imgui are pinned submodules; without this the build has no
          # dependencies to compile against.
          submodules: recursive

      - name: Cache the Vulkan SDK
        # Caches the unpacked SDK rather than the installer, which skips both
        # the download and the unpack on a hit.
        #
        # This is done here rather than with the install action's own `cache`
        # input because that input pulls in actions/cache@v4, which still
        # targets the deprecated Node 20. Doing it ourselves means we control
        # the version.
        id: vulkan-cache
        uses: actions/cache@v5
        with:
          path: VULKAN_SDK
          key: ${{ runner.os }}-vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        # Supplies glslc (shaders are compiled at build time, not committed)
        # plus the Vulkan headers and import library. Skipped entirely when the
        # cache above already produced a usable SDK.
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: false

      - name: Export the cached Vulkan SDK to the environment
        # The install action sets VULKAN_SDK and extends PATH itself; on a cache
        # hit it never runs, so the same has to happen by hand.
        if: steps.vulkan-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          sdk="$(pwd -W)/VULKAN_SDK"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          "$sdk/bin/glslangValidator" --version

      - name: Set up MSVC
        # Hand-rolled rather than ilammy/msvc-dev-cmd, which declares Node 20
        # and has no newer release: v1.13.0 is the latest tag and still targets
        # it. Locating the toolchain with vswhere and diffing the environment
        # vcvars64 produces is what that action does anyway, and it drops a
        # third-party dependency from the build path.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw "No Visual Studio install with the C++ toolchain was found" }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          Write-Host "Using $vcvars"

          # vcvars only sets variables for the cmd session it runs in, so the
          # environment is captured before and after and the difference handed
          # to GITHUB_ENV, where later steps will pick it up.
          $before = @{}
          cmd /c "set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $before[$matches[1]] = $matches[2] }
          }

          $changed = 0
          cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]
              if ($before[$name] -ne $value) {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                $changed++
              }
            }
          }

          if ($changed -eq 0) { throw "vcvars64.bat changed no environment variables" }
          Write-Host "Exported $changed environment variables from vcvars64."

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_MSVC_RUNTIME_LIBRARY=${{ matrix.msvc_runtime }} -DCMAKE_POLICY_DEFAULT_CMP0091=NEW

      - name: Build
        run: cmake --build build

      - name: Unit tests
        # Gameplay rules in isolation -- the absorb-vs-break routing, the
        # sliding damage window, charge spending. Fast, and a failure here names
        # the exact rule that broke rather than just "the episode looked wrong".
        run: ctest --test-dir build --output-on-failure

      - name: Check expected outputs exist
        # cmake --build succeeding does not guarantee the artefacts landed where
        # the packaging step expects them, and that has bitten this project
        # before.
        shell: pwsh
        run: |
          $expected = @(
            "build/HorizonUnseen.exe",
            "build/husim.dll",
            "build/shaders/sprite.vert.spv",
            "build/shaders/sprite.frag.spv",
            "build/assets/atlas.png",
            "build/assets/atlas.json"
          )
          $missing = $expected | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "::error::Missing expected build outputs:"
            $missing | ForEach-Object { Write-Host "::error::  $_" }
            exit 1
          }
          Write-Host "All expected build outputs present."

      - name: Verify the sprite atlas matches the SpriteId contract
        # The atlas is generated art and the enum is hand-written C++; they are a
        # hard contract and drift silently. Cheap to check, annoying to debug.
        shell: pwsh
        run: python tools/check_atlas.py

      - name: Install Python test dependencies
        run: python -m pip install --quiet numpy

      - name: Headless gameplay test
        # This is the part that makes CI worth more than a compile check.
        # src/Sim exposes GameWorld over a C ABI with no GLFW, no Vulkan and no
        # window, so the actual game logic can be exercised on a runner that has
        # neither a GPU nor a display: waves spawn, collisions resolve, cells
        # break, episodes terminate.
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/rl
          HUSIM_PATH: ${{ github.workspace }}/build/husim.dll
        run: python tools/rl/ci_gameplay_test.py
